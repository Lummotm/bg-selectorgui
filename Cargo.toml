[package]
name = "bgselector-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
# Slint solo para Wayland (desactivamos X11) y con la flag de compatibilidad necesaria
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "backend-winit-wayland", "renderer-femtovg"] }

# Mantenemos 'image' ligero desactivando sus default-features para no incluir formatos raros
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }

dirs = "5.0"
walkdir = "2.5.0"
rand = "0.10.2"

[build-dependencies]
# Sincronizamos la versión con la de la dependencia principal para evitar conflictos
slint-build = "1.17.1"

# Mantenemos tus ajustes para que en desarrollo siga siendo fluido compilar
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# --- PERFIL DE MÁXIMA COMPRESIÓN PARA RELEASE ---
[profile.release]
opt-level = "z"     # Optimiza priorizando el menor tamaño del archivo
lto = true          # Link Time Optimization: elimina funciones no usadas de las librerías
codegen-units = 1   # Maximiza la efectividad del LTO
strip = true        # Elimina símbolos de depuración y nombres de funciones del binario
panic = "abort"     # Elimina la lógica de desenrollado de pila al fallar
